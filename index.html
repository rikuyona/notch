  <h1>Notch</h1>
  <p>Notch は、Windows の画面上部に表示する個人用のユーティリティです。作者が自分の PC で使うために作っています。</p>

  <h2>Google との連携について</h2>
  <p>Notch にドロップした写真を、利用者自身の Google フォトに保存するために、Google フォト Library API を使います。</p>
  <p>求める権限は「写真の追加」のみ（<code>photoslibrary.appendonly</code>）です。既存の写真・アルバム・プロフィールを読むことはできません。</p>
